<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hermes Browser Operator</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #15181d;
        background: #f6f7f9;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      label {
        display: block;
        margin-top: 10px;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 8px;
        border: 1px solid #c8ced8;
        border-radius: 6px;
        background: white;
      }
      button {
        margin-top: 12px;
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        color: white;
        background: #155eef;
        cursor: pointer;
      }
      button.secondary {
        color: #15181d;
        background: #e3e7ee;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row button {
        flex: 1;
      }
      #status {
        margin-top: 10px;
        min-height: 20px;
        color: #3b4351;
      }
      .hint {
        margin-top: 10px;
        color: #5a6472;
      }
    </style>
  </head>
  <body>
    <h1>Hermes Browser Operator</h1>

    <label for="gatewayUrl">Gateway URL</label>
    <input id="gatewayUrl" placeholder="http://127.0.0.1:8765" />

    <label for="sessionId">Session ID</label>
    <input id="sessionId" placeholder="default" />

    <label for="token">Token</label>
    <input id="token" type="password" placeholder="optional" />

    <div class="row">
      <button id="save">Save</button>
      <button id="snapshot" class="secondary">Send snapshot</button>
    </div>

    <div id="status"></div>
    <div class="hint">Use the current browser login session. Hermes will ask before risky clicks.</div>

    <script src="popup.js"></script>
  </body>
</html>
