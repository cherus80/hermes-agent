<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hermes Browser Operator</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #15181d;
        background: #f6f7f9;
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .logo {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        box-shadow: 0 8px 18px rgba(21, 94, 239, 0.22);
      }
      label {
        display: block;
        margin-top: 10px;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 8px;
        border: 1px solid #c8ced8;
        border-radius: 6px;
        background: white;
      }
      select {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 8px;
        border: 1px solid #c8ced8;
        border-radius: 6px;
        background: white;
      }
      button {
        margin-top: 12px;
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        color: white;
        background: #155eef;
        cursor: pointer;
      }
      button.secondary {
        color: #15181d;
        background: #e3e7ee;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row button {
        flex: 1;
      }
      #status {
        margin-top: 10px;
        min-height: 20px;
        color: #3b4351;
      }
      .hint {
        margin-top: 10px;
        color: #5a6472;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img class="logo" src="icons/icon-48.png" alt="" />
      <h1>Hermes Browser Operator</h1>
    </div>

    <label for="gatewayUrl">Gateway URL</label>
    <input id="gatewayUrl" placeholder="http://127.0.0.1:8765" />

    <label for="sessionId">Session ID</label>
    <input id="sessionId" placeholder="default" />

    <label for="token">Token</label>
    <input id="token" type="password" placeholder="optional" />

    <label for="actionApprovalMode">Action approval mode</label>
    <select id="actionApprovalMode">
      <option value="confirm">Ask before page actions</option>
      <option value="auto">Allow actions without prompts</option>
    </select>

    <div class="row">
      <button id="save">Save</button>
      <button id="snapshot" class="secondary">Send snapshot</button>
    </div>

    <div id="status"></div>
    <div class="hint">
      Use your current browser login session. Safe mode asks before clicks,
      form changes, and navigation; auto mode runs queued actions immediately.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
